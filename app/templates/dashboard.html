<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard de Aceleração</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
  <header class="topo">
    <h1>Aceleração – MPU6050</h1>
    <span id="status" class="status">Carregando…</span>
  </header>

  <main>
    <section class="filtros">
      <label>Dispositivo
        <select id="dispositivo"></select>
      </label>

      <div class="abas" role="tablist">
        <button type="button" class="aba ativa" data-modo="tempo-real" role="tab">Tempo real</button>
        <button type="button" class="aba" data-modo="historico" role="tab">Histórico</button>
      </div>

      <div id="controles-historico" class="periodo" hidden>
        <label>Início <input type="datetime-local" id="inicio" step="1"></label>
        <label>Fim <input type="datetime-local" id="fim" step="1"></label>
        <button type="button" id="aplicar" class="botao">Aplicar</button>
      </div>

      <div class="exportar">
        <a id="csv" class="botao secundario" href="#">Exportar CSV</a>
        <a id="csv-excel" class="botao secundario" href="#" title="Separador ; e vírgula decimal">CSV (Excel)</a>
      </div>
    </section>

    <section class="cards">
      <article class="card">
        <h2>Leituras no período</h2>
        <p class="valor" id="card-total">–</p>
      </article>
      <article class="card">
        <h2>Total armazenado</h2>
        <p class="valor" id="card-armazenado">–</p>
      </article>
      <article class="card card-largo">
        <h2>Última leitura <span id="card-ultima-hora" class="sub"></span></h2>
        <p class="valor eixos">
          <span><i class="chip chip-x"></i>X <b id="ultimo-x">–</b></span>
          <span><i class="chip chip-y"></i>Y <b id="ultimo-y">–</b></span>
          <span><i class="chip chip-z"></i>Z <b id="ultimo-z">–</b></span>
        </p>
      </article>
    </section>

    <section class="painel">
      <div class="painel-cabecalho">
        <h2>Aceleração (m/s²)</h2>
        <span id="nota-grafico" class="sub"></span>
      </div>
      <div id="ferramentas" class="ferramentas" hidden>
        <div class="grupo" role="group" aria-label="Período rápido">
          <button type="button" class="opcao" data-minutos="15">15 min</button>
          <button type="button" class="opcao" data-minutos="60">1 h</button>
          <button type="button" class="opcao" data-minutos="360">6 h</button>
          <button type="button" class="opcao" data-minutos="1440">24 h</button>
          <button type="button" class="opcao" data-minutos="10080">7 d</button>
        </div>
        <div class="grupo" role="group" aria-label="Navegar no período">
          <button type="button" class="opcao" id="anterior" title="Recuar meio período" aria-label="Recuar meio período">◀</button>
          <button type="button" class="opcao" id="afastar" title="Dobrar o período visível">Afastar</button>
          <button type="button" class="opcao" id="proximo" title="Avançar meio período" aria-label="Avançar meio período">▶</button>
        </div>
        <div class="grupo" role="group" aria-label="Zoom">
          <button type="button" class="opcao" id="voltar" title="Desfazer o último zoom ou deslocamento (duplo clique no gráfico)">Voltar</button>
          <button type="button" class="opcao" id="redefinir" title="Voltar ao período original">Redefinir</button>
        </div>
      </div>
      <div class="grafico">
        <canvas id="grafico"></canvas>
        <div id="selecao" class="selecao" hidden></div>
      </div>
      <p id="dica-grafico" class="dica"></p>
    </section>

    <section class="painel">
      <h2>Estatísticas do período</h2>
      <div class="tabela-rolagem">
        <table class="tabela">
          <thead>
            <tr><th>Eixo</th><th>Mínimo</th><th>Máximo</th><th>Média</th><th>Desvio padrão</th></tr>
          </thead>
          <tbody id="tabela-stats">
            <tr><td colspan="5" class="vazio">Sem dados</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
